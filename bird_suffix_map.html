<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目-科鸟类后缀关系图（科内）</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #f2f6fd;
      --text: #1e2f4c;
      --muted: #5d6d88;
      --line: #3f7fbc;
      --line-soft: #a6c1e3;
      --panel: #ffffff;
      --shadow: 0 10px 24px rgba(18, 34, 66, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100vh;
      gap: 12px;
      padding: 10px;
    }

    .tree-panel {
      background: var(--panel);
      border: 1px solid #d8e2f2;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .tree-title {
      padding: 12px 14px;
      font-weight: 700;
      font-size: 18px;
      border-bottom: 1px solid #e3eaf7;
      background: linear-gradient(180deg, #f8fbff, #f3f7ff);
      color: #1e3d69;
    }

    .tree-meta {
      padding: 8px 14px;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid #edf1f8;
      line-height: 1.45;
    }

    .tree-scroll {
      flex: 1;
      overflow: auto;
      padding: 10px 12px;
    }

    details {
      margin-bottom: 4px;
    }

    summary {
      cursor: pointer;
      list-style: none;
      user-select: none;
      font-weight: 600;
      color: #1f3d6a;
      padding: 5px 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fbff;
      border: 1px solid #e5edf8;
      margin: 0;
      font-size: 14px;
    }

    summary::-webkit-details-marker { display: none; }
    summary:focus { outline: none; }

    details[open] > summary {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .order-info {
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
      font-weight: 500;
      white-space: nowrap;
    }

    .family-list {
      margin: 0;
      padding: 6px 0 6px 10px;
      background: #fff;
      border: 1px solid #e5edf8;
      border-top: none;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .family-item {
      width: 100%;
      text-align: left;
      border: none;
      background: #fff;
      color: #223f68;
      font-size: 13px;
      padding: 8px 10px;
      margin-bottom: 2px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .family-item:hover {
      background: #f0f5ff;
    }

    .family-item.active {
      background: #1f4f8f;
      color: #fff;
    }

    .family-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .family-count {
      color: #5f7292;
      font-size: 12px;
      white-space: nowrap;
    }

    .family-item.active .family-count {
      color: #d7e5ff;
    }

    .graph-panel {
      position: relative;
      background: var(--panel);
      border: 1px solid #d8e2f2;
      border-radius: 14px;
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .graph-head {
      padding: 10px 14px;
      border-bottom: 1px solid #e3eaf6;
      background: linear-gradient(180deg, #f9fbff, #f4f8ff);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .graph-title {
      font-weight: 700;
      color: #1e3d69;
      font-size: 17px;
    }

    .graph-sub {
      color: var(--muted);
      font-size: 12px;
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #relationChart {
      width: 100%;
      height: 100%;
      min-height: 600px;
    }

    .empty-hint {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      background: #fff;
      color: var(--muted);
      border: 1px solid #d8e4f4;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .detail-panel {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: min(520px, calc(100% - 28px));
      max-height: 42%;
      overflow: auto;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #d6e3f5;
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 10px 12px;
      display: none;
      z-index: 4;
    }

    .detail-panel.show {
      display: block;
    }

    .detail-title {
      margin: 0 0 8px;
      color: #173d6b;
      font-size: 14px;
    }

    .detail-close {
      position: absolute;
      right: 8px;
      top: 6px;
      cursor: pointer;
      color: #6f7e98;
      font-size: 12px;
      border: 1px solid #d4e0f0;
      border-radius: 999px;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      background: #f8fbff;
    }

    .detail-count {
      font-size: 12px;
      color: #5f7394;
      margin-bottom: 8px;
    }

    .detail-list {
      margin: 0;
      padding-left: 18px;
      max-height: 200px;
      overflow: auto;
    }

    .detail-list li {
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 1.4;
    }

    .detail-list b {
      color: #1f4370;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="tree-panel">
      <div class="tree-title">目 - 科（按文件夹展开）</div>
      <div id="treeMeta" class="tree-meta"></div>
      <div id="treeContainer" class="tree-scroll"></div>
    </aside>

    <main class="graph-panel">
      <div class="graph-head">
        <div>
          <div class="graph-title" id="graphTitle">点击左侧“科”查看关系图</div>
          <div class="graph-sub" id="graphSub">中文后缀：中文名最后一个字；英文后缀：英文名最后一个词</div>
        </div>
        <div id="graphStat" class="graph-sub">未选择科</div>
      </div>
      <div class="chart-wrap">
        <div id="relationChart"></div>
        <div id="emptyHint" class="empty-hint">请先在左侧点击科，渲染该科中文/英文后缀关系图。</div>
        <section id="detailPanel" class="detail-panel" aria-live="polite">
          <div class="detail-close" id="detailClose">✕</div>
          <h4 id="detailTitle" class="detail-title"></h4>
          <div id="detailCount" class="detail-count"></div>
          <ul id="detailList" class="detail-list"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="./bird_order_family_data.js"></script>
  <script>
    const payload = window.BIRD_TAXONOMY_PAYLOAD || { orders: [], familyMap: {} };
    const treeContainer = document.getElementById('treeContainer');
    const treeMeta = document.getElementById('treeMeta');
    const graphTitle = document.getElementById('graphTitle');
    const graphSub = document.getElementById('graphSub');
    const graphStat = document.getElementById('graphStat');
    const chartDom = document.getElementById('relationChart');
    const emptyHint = document.getElementById('emptyHint');
    const detailPanel = document.getElementById('detailPanel');
    const detailTitle = document.getElementById('detailTitle');
    const detailCount = document.getElementById('detailCount');
    const detailList = document.getElementById('detailList');
    const detailClose = document.getElementById('detailClose');

    if (!window.echarts || !payload.orders.length) {
      emptyHint.textContent = '数据未加载或格式异常，请确认 bird_order_family_data.js 可访问。';
    }

    const chart = window.echarts ? echarts.init(chartDom) : null;
    let currentFamilyKey = null;
    let baseGraph = null;
    const NORMAL_OPACITY = 0.8;

    const totalFamilies = payload.orders.reduce((sum, order) => sum + (order.families ? order.families.length : 0), 0);
    const totalBirds = payload.orders.reduce((sum, order) => sum + (order.families ? order.families.reduce((s, f) => s + (f.count || 0), 0) : 0), 0);
    treeMeta.textContent = `共 ${payload.orders.length} 个目（中文），${totalFamilies} 个科，${totalBirds} 个科内鸟种记录`;

    function buildTree() {
      treeContainer.innerHTML = '';
      payload.orders.forEach((order) => {
        const details = document.createElement('details');
        details.open = true;

        const families = order.families || [];
        const orderCount = families.reduce((sum, f) => sum + (f.count || 0), 0);
        const summary = document.createElement('summary');
        summary.innerHTML = `<span>${order.nameZh || `${order.name}目`}</span><span class="order-info">${order.name} · ${orderCount} 种</span>`;
        details.appendChild(summary);

        const list = document.createElement('div');
        list.className = 'family-list';

        families.forEach((family, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'family-item';
          btn.dataset.key = `${family.id}`;
          if (idx === 0 && !currentFamilyKey) {
            btn.tabIndex = 0;
          }

          const label = document.createElement('span');
          label.className = 'family-name';
          const familyEn = family.english || '英文名待补';
          label.textContent = `${family.name} / ${normalizeFamilyEnglishName(familyEn)}`;

          const count = document.createElement('span');
          count.className = 'family-count';
          count.textContent = `（${family.count || 0}）`;

          btn.appendChild(label);
          btn.appendChild(count);
        btn.addEventListener('click', () => onFamilyClick(family.id, family.name, `${order.nameZh || `${order.name}目`}（${order.name}）`));
          list.appendChild(btn);
        });

        if (!families.length) {
          const none = document.createElement('div');
          none.className = 'family-list';
          none.style.padding = '10px';
          none.style.fontSize = '12px';
          none.style.color = '#8290a7';
          none.textContent = '该目下无科数据';
          details.appendChild(none);
        } else {
          details.appendChild(list);
        }

        treeContainer.appendChild(details);
      });
    }

    function getChineseSuffix(name) {
      const text = (name || '').trim();
      return text ? text.slice(-1) : '';
    }

    function getEnglishSuffix(name) {
      const text = (name || '')
        .replace(/[\[\]();,，；:：.!?？！\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (!text) {
        return '';
      }
      const words = text.split(' ').filter(Boolean);
      return words.length ? words[words.length - 1] : '';
    }

    function normalizeFamilyEnglishName(name) {
      return String(name || '')
        .replace(/\s*\(\s*\d+\s*:\s*\d+\s*\)\s*$/g, '')
        .trim();
    }

    function buildFamilyEdges(familyData) {
      const edgeMap = new Map();
      const birds = Array.isArray(familyData.birds) ? familyData.birds : [];
      birds.forEach((bird) => {
        const cn = getChineseSuffix(bird.chinese);
        const en = getEnglishSuffix(bird.english);
        if (!cn || !en) return;

        const key = `cn:${cn}||en:${en}`;
        if (!edgeMap.has(key)) {
          edgeMap.set(key, {
            id: `e-${key}`,
            cn,
            en,
            count: 0,
            birds: [],
            birdSet: new Set()
          });
        }
        const bucket = edgeMap.get(key);
        const bKey = `${bird.chinese}||${bird.english}`;
        if (!bucket.birdSet.has(bKey)) {
          bucket.birdSet.add(bKey);
          bucket.count += 1;
          bucket.birds.push({
            chinese: bird.chinese || '',
            english: bird.english || '',
            scientific: bird.scientific || ''
          });
        }
      });

      return {
        edges: Array.from(edgeMap.values()).map((e) => {
          delete e.birdSet;
          e.birds.sort((a, b) => (a.chinese || '').localeCompare(b.chinese || ''));
          return e;
        })
      };
    }

    function sortNodeByDegree(nodes, nodeCountMap) {
      return nodes.sort((a, b) => {
        const diff = (nodeCountMap.get(b) || 0) - (nodeCountMap.get(a) || 0);
        if (diff !== 0) return diff;
        return a.localeCompare(b);
      });
    }

    function optimizeBipartiteOrder(rawCn, rawEn, edges, rounds = 8) {
      let cnOrder = [...rawCn];
      let enOrder = [...rawEn];
      if (!cnOrder.length || !enOrder.length || !edges.length) {
        return { cn: cnOrder, en: enOrder };
      }

      const cnToEn = new Map();
      const enToCn = new Map();
      edges.forEach((edge) => {
        if (!cnToEn.has(edge.cn)) {
          cnToEn.set(edge.cn, new Map());
        }
        if (!enToCn.has(edge.en)) {
          enToCn.set(edge.en, new Map());
        }
        const enMap = cnToEn.get(edge.cn);
        enMap.set(edge.en, (enMap.get(edge.en) || 0) + edge.count);
        const cnMap = enToCn.get(edge.en);
        cnMap.set(edge.cn, (cnMap.get(edge.cn) || 0) + edge.count);
      });

      const reorderByBarycenter = (nodes, adjMap, oppositePos) => {
        return [...nodes].sort((a, b) => {
          const score = (name) => {
            const neighbors = adjMap.get(name);
            if (!neighbors || !neighbors.size) {
              return Number.MAX_SAFE_INTEGER;
            }
            let totalWeight = 0;
            let weightSum = 0;
            neighbors.forEach((w, target) => {
              const p = oppositePos.get(target);
              if (p === undefined) {
                return;
              }
              totalWeight += p * w;
              weightSum += w;
            });
            return weightSum ? totalWeight / weightSum : Number.MAX_SAFE_INTEGER;
          };
          const sa = score(a);
          const sb = score(b);
          if (sa !== sb) return sa - sb;
          return a.localeCompare(b);
        });
      };

      for (let r = 0; r < rounds; r += 1) {
        const prevCnOrder = [...cnOrder];
        const prevEnOrder = [...enOrder];
        const cnPos = new Map(cnOrder.map((name, idx) => [name, idx]));
        enOrder = reorderByBarycenter(enOrder, enToCn, cnPos);
        const enPos = new Map(enOrder.map((name, idx) => [name, idx]));
        const nextCnOrder = reorderByBarycenter(cnOrder, cnToEn, enPos);

        const sameCn = nextCnOrder.length === prevCnOrder.length && nextCnOrder.every((name, i) => name === prevCnOrder[i]);
        const sameEn = enOrder.length === prevEnOrder.length && enOrder.every((name, i) => name === prevEnOrder[i]);
        cnOrder = nextCnOrder;
        if (sameCn && sameEn) {
          break;
        }
      }

      return { cn: cnOrder, en: enOrder };
    }

    function crossingCost(cnOrder, enOrder, edges) {
      if (!edges.length || cnOrder.length < 2 || enOrder.length < 2) {
        return 0;
      }
      const cnPos = new Map(cnOrder.map((name, idx) => [name, idx]));
      const enPos = new Map(enOrder.map((name, idx) => [name, idx]));
      let cost = 0;
      for (let i = 0; i < edges.length; i += 1) {
        const a = edges[i];
        const ai = cnPos.get(a.cn);
        const aj = enPos.get(a.en);
        if (ai === undefined || aj === undefined) {
          continue;
        }
        for (let j = i + 1; j < edges.length; j += 1) {
          const b = edges[j];
          const bi = cnPos.get(b.cn);
          const bj = enPos.get(b.en);
          if (bi === undefined || bj === undefined) {
            continue;
          }
          if ((ai - bi) * (aj - bj) < 0) {
            cost += (a.count || 1) * (b.count || 1);
          }
        }
      }
      return cost;
    }

    function improveCrossingBySwaps(cnOrder, enOrder, edges, rounds = 6) {
      if (!edges.length || cnOrder.length < 2 || enOrder.length < 2) {
        return { cn: cnOrder, en: enOrder };
      }

      let left = [...cnOrder];
      let right = [...enOrder];
      let bestCost = crossingCost(left, right, edges);

      for (let r = 0; r < rounds; r += 1) {
        let improved = false;

        for (let side = 0; side < 2; side += 1) {
          const order = side === 0 ? left : right;
          const target = side === 0 ? right : left;
          const isCnSide = side === 0;
          let candidate = order;
          for (let i = 0; i < order.length - 1; i += 1) {
            const swapped = [...order];
            const tmp = swapped[i];
            swapped[i] = swapped[i + 1];
            swapped[i + 1] = tmp;

            const nextLeft = isCnSide ? swapped : left;
            const nextRight = isCnSide ? right : swapped;
            const c = crossingCost(nextLeft, nextRight, edges);
            if (c < bestCost) {
              bestCost = c;
              candidate = swapped;
              improved = true;
            }
          }
          if (isCnSide) {
            left = candidate;
          } else {
            right = candidate;
          }
        }

        if (!improved) {
          break;
        }
      }

      return { cn: left, en: right };
    }

    function optimizeConcentricOrder(rawCn, rawEn, edges, rounds = 8) {
      const base = improveCrossingBySwaps(rawCn, rawEn, edges, rounds);
      const candidates = [
        base,
        { cn: [...base.cn].reverse(), en: base.en },
        { cn: base.cn, en: [...base.en].reverse() },
        { cn: [...base.cn].reverse(), en: [...base.en].reverse() }
      ];

      let best = base;
      let bestCost = crossingCost(base.cn, base.en, edges);

      candidates.forEach((candidate) => {
        const refined = improveCrossingBySwaps(candidate.cn, candidate.en, edges, Math.max(1, rounds));
        const cost = crossingCost(refined.cn, refined.en, edges);
        if (cost < bestCost) {
          bestCost = cost;
          best = refined;
        }
      });

      return best;
    }

    function rotateListClockwise(items) {
      if (!Array.isArray(items) || items.length < 2) {
        return [...(items || [])];
      }
      return [...items.slice(-1), ...items.slice(0, -1)];
    }

    function swapPair(items, a, b) {
      const idxA = items.indexOf(a);
      const idxB = items.indexOf(b);
      if (idxA === -1 || idxB === -1 || idxA === idxB) {
        return items;
      }
      const next = [...items];
      next[idxA] = b;
      next[idxB] = a;
      return next;
    }

    function applyManualOrders(familyName, cnOrder, enOrder) {
      let orderedCn = [...cnOrder];
      let orderedEn = [...enOrder];

      if (familyName === '鹰科') {
        orderedCn = swapPair(orderedCn, '鵟', '鹫');
        orderedEn = swapPair(orderedEn, 'Lammergeier', 'Buzzard');
      }

      if (familyName === '鹟科') {
        orderedCn = swapPair(orderedCn, '尾', '鹟');
        orderedEn = swapPair(orderedEn, 'Niltava', 'Forktail');
      }

      if (familyName === '鸭科') {
        orderedEn = swapPair(orderedEn, 'Swan', 'Shoveler');
        orderedEn = swapPair(orderedEn, 'Goose', 'Shelduck');
      }

      return { orderedCn, orderedEn };
    }

    function placeNodes(mode, cnList, enList, graphWidth, graphHeight) {
      const nodes = [];
      if (mode === 'split') {
        const leftX = Math.max(110, graphWidth * 0.28);
        const rightX = Math.min(graphWidth - 110, graphWidth * 0.72);
        const topPad = 40;
        const bottomPad = 48;
        const workHeight = Math.max(1, graphHeight - topPad - bottomPad);
        const centerY = graphHeight / 2;
        const cnStep = workHeight / Math.max(1, cnList.length);
        const enStep = workHeight / Math.max(1, enList.length);
        const cnStart = centerY - (cnStep * (cnList.length - 1)) / 2;
        const enStart = centerY - (enStep * (enList.length - 1)) / 2;

        cnList.forEach((name, i) => {
          const y = Math.max(topPad, Math.min(graphHeight - bottomPad, cnStart + cnStep * i));
          nodes.push({
            id: `CN:${name}`,
            name,
            raw: name,
            type: 'cn',
            x: leftX,
            y,
            symbolSize: 42,
            itemStyle: { color: '#4f7bb6' },
            label: {
              show: true,
              position: 'right',
              distance: 10,
              formatter: '{b}',
              color: '#15315e',
              fontSize: 14,
              fontWeight: 600,
              textShadowColor: '#ffffff',
              textShadowBlur: 4
            }
          });
        });

        enList.forEach((name, i) => {
          const y = Math.max(topPad, Math.min(graphHeight - bottomPad, enStart + enStep * i));
          nodes.push({
            id: `EN:${name}`,
            name,
            raw: name,
            type: 'en',
            x: rightX,
            y,
            symbolSize: 42,
            itemStyle: { color: '#d66f3b' },
            label: {
              show: true,
              position: 'left',
              distance: 10,
              formatter: '{b}',
              color: '#3b4d64',
              fontSize: 14,
              fontWeight: 600,
              textShadowColor: '#ffffff',
              textShadowBlur: 4
            }
          });
        });
        return nodes;
      }

      const cx = graphWidth / 2;
      const cy = graphHeight / 2;
      const base = Math.min(graphWidth, graphHeight);
      const innerR = base * 0.21;
      const outerR = base * 0.37;

      cnList.forEach((name, i) => {
        const angle = (Math.PI * 2 * i) / Math.max(1, cnList.length);
        nodes.push({
          id: `CN:${name}`,
          name,
          raw: name,
          type: 'cn',
          x: cx + innerR * Math.cos(angle),
          y: cy + innerR * Math.sin(angle),
          symbolSize: 36,
          itemStyle: { color: '#4f7bb6' },
          label: {
            show: true,
            position: 'inside',
            color: '#15315e',
            fontSize: 13,
            fontWeight: 600,
            textShadowColor: '#ffffff',
            textShadowBlur: 4
          }
        });
      });

      enList.forEach((name, i) => {
        const angle = (Math.PI * 2 * i) / Math.max(1, enList.length);
        nodes.push({
          id: `EN:${name}`,
          name,
          raw: name,
          type: 'en',
          x: cx + outerR * Math.cos(angle),
          y: cy + outerR * Math.sin(angle),
          symbolSize: 36,
          itemStyle: { color: '#d66f3b' },
          label: {
            show: true,
            position: 'inside',
            color: '#3b4d64',
            fontSize: 13,
            fontWeight: 600,
            textShadowColor: '#ffffff',
            textShadowBlur: 4
          }
        });
      });

      return nodes;
    }

    function buildGraphOption(familyData, familyName, orderName) {
      const { edges } = buildFamilyEdges(familyData);
      const nodesetCn = new Map();
      const nodesetEn = new Map();

      edges.forEach((edge) => {
        const cnCount = nodesetCn.get(edge.cn) || 0;
        const enCount = nodesetEn.get(edge.en) || 0;
        nodesetCn.set(edge.cn, cnCount + edge.count);
        nodesetEn.set(edge.en, enCount + edge.count);
      });

      const cnList = sortNodeByDegree(Array.from(nodesetCn.keys()), nodesetCn);
      const enList = sortNodeByDegree(Array.from(nodesetEn.keys()), nodesetEn);
      const optimized = optimizeBipartiteOrder(cnList, enList, edges);
      const mode = optimized.en.length > 10 ? 'concentric' : 'split';
      const refined = mode === 'concentric'
        ? optimizeConcentricOrder(optimized.cn, optimized.en, edges)
        : improveCrossingBySwaps(optimized.cn, optimized.en, edges, 12);
      let orderedCn = refined.cn;
      let orderedEn = refined.en;

      if (['鹟科', '丘鹬科', '雉科', '鹰科'].includes(familyName)) {
        orderedCn = rotateListClockwise(orderedCn);
      }
      const adjusted = applyManualOrders(familyName, orderedCn, orderedEn);
      orderedCn = adjusted.orderedCn;
      orderedEn = adjusted.orderedEn;

      const width = chartDom.clientWidth;
      const height = chartDom.clientHeight;
      const nodes = placeNodes(mode, orderedCn, orderedEn, width, height);

      const links = edges.map((edge) => {
        const source = `CN:${edge.cn}`;
        const target = `EN:${edge.en}`;
        return {
          id: edge.id,
          source,
          target,
          value: edge.count,
          count: edge.count,
          cn: edge.cn,
          en: edge.en,
          birds: edge.birds,
          lineStyle: {
            color: 'rgba(62, 110, 180, 0.75)',
            width: 1.4 + Math.min(2.6, edge.count * 0.14),
            curveness: mode === 'concentric' ? 0.15 : 0.08,
            opacity: 0.9
          },
          label: {
            show: true,
            formatter: '{c}',
            color: '#173f75',
            fontWeight: 700,
            fontSize: 12,
            backgroundColor: 'rgba(255, 255, 255, 0.8)',
            padding: [2, 5, 2, 5],
            borderRadius: 10,
            borderColor: '#d1ddf0',
            borderWidth: 1,
            shadowColor: '#ffffff',
            shadowBlur: 4,
            position: 'middle'
          }
        };
      });

      const ringGraphics = mode === 'concentric'
        ? [
            {
              type: 'circle',
              left: 'center',
              top: 'center',
              shape: {
                cx: width / 2,
                cy: height / 2,
                r: Math.min(width, height) * 0.21
              },
              style: {
                fill: 'rgba(79, 123, 182, 0.05)',
                stroke: 'rgba(79, 123, 182, 0.25)',
                lineWidth: 2,
                lineDash: [4, 4]
              }
            },
            {
              type: 'circle',
              left: 'center',
              top: 'center',
              shape: {
                cx: width / 2,
                cy: height / 2,
                r: Math.min(width, height) * 0.37
              },
              style: {
                fill: 'rgba(214, 111, 59, 0.03)',
                stroke: 'rgba(214, 111, 59, 0.20)',
                lineWidth: 2,
                lineDash: [4, 4]
              }
            }
          ]
        : [];

      return {
        mode,
        nodes,
        links,
        rings: ringGraphics,
        stats: {
          cnCount: orderedCn.length,
          enCount: orderedEn.length,
          edgeCount: edges.length,
          totalBirds: edges.reduce((sum, e) => sum + e.count, 0)
        },
        subtitle: `${orderName} > ${familyName} · 中文后缀${cnList.length}个；英文后缀${enList.length}个；${edges.length}条关系`
      };
    }

    function applyNodeFocus(nodeId = null) {
      if (!baseGraph || !chart) return;
      const { nodes, links } = baseGraph;
      const linkSet = new Set();
      const nodeSet = new Set();

      if (nodeId) {
        links.forEach((link) => {
          if (link.source === nodeId || link.target === nodeId) {
            linkSet.add(link.id);
            nodeSet.add(link.source);
            nodeSet.add(link.target);
          }
        });
      }

      const updatedNodes = nodes.map((n) => {
        const isSelectedNode = nodeId && nodeSet.has(n.id);
        return {
          ...n,
          itemStyle: {
            ...n.itemStyle,
            opacity: nodeId ? (isSelectedNode ? 1 : 0.22) : 1,
            shadowBlur: isSelectedNode ? 8 : 0,
            shadowColor: isSelectedNode ? '#5c8ad0' : 'transparent'
          }
        };
      });

      const updatedLinks = links.map((l) => {
        const isHit = nodeId ? linkSet.has(l.id) : true;
        return {
          ...l,
          lineStyle: {
            ...l.lineStyle,
            opacity: isHit ? 1 : 0.12,
            width: isHit ? Math.max(1.6, l.lineStyle.width) : Math.min(1.1, l.lineStyle.width),
            shadowBlur: isHit ? 5 : 0,
            shadowColor: 'rgba(72, 123, 191, 0.6)'
          },
          label: {
            ...l.label,
            opacity: isHit ? 1 : 0.2
          }
        };
      });

      chart.setOption({
        series: [{
          data: updatedNodes,
          links: updatedLinks
        }]
      }, false, true);
    }

    function showEdgePanel(linkData) {
      if (!linkData) {
        detailPanel.classList.remove('show');
        return;
      }
      detailTitle.textContent = `${linkData.cn} ↔ ${linkData.en}`;
      detailCount.textContent = `${linkData.count} 种关系；包含 ${linkData.birds.length} 条独特鸟名（按中文名排序）`;

      detailList.innerHTML = '';
      linkData.birds.forEach((bird) => {
        const li = document.createElement('li');
        li.innerHTML = `<b>${bird.chinese}</b> / ${bird.english}${bird.scientific ? ` <span style="color:#71809e">（${bird.scientific}）</span>` : ''}`;
        detailList.appendChild(li);
      });
      detailPanel.classList.add('show');
    }

    function normalizeFamilyKey(rawKey) {
      if (payload.familyMap[rawKey]) {
        return rawKey;
      }
      const tokens = String(rawKey || '').split('::');
      if (tokens.length >= 3) {
        const family = tokens.slice(2).join('::');
        const candidate = `${tokens[1]}::${family}`;
        if (payload.familyMap[candidate]) {
          return candidate;
        }
      }
      return rawKey;
    }

    function renderFamily(key, familyName, orderName) {
      const familyKey = normalizeFamilyKey(key);
      const data = payload.familyMap[familyKey];
      if (!data) {
        emptyHint.textContent = '未找到该科对应数据';
        chart.clear();
        emptyHint.style.display = 'block';
        graphTitle.textContent = `${orderName} > ${familyName}`;
        graphStat.textContent = '0 后缀关系';
        return;
      }

      const { mode, nodes, links, rings, stats, subtitle } = buildGraphOption(data, familyName, orderName);
      currentFamilyKey = familyKey;

      graphTitle.textContent = `${orderName} · ${familyName}`;
      graphSub.textContent = `关系图布局：${mode === 'split' ? '左右两列' : '同心圆（内中文、外英文）'}`;
      graphStat.textContent = `${stats.cnCount} 个中文后缀 / ${stats.enCount} 个英文后缀 / ${stats.edgeCount} 条关系 / ${stats.totalBirds} 物种`;

      emptyHint.style.display = 'none';

      baseGraph = { nodes, links, rings, mode };
      graphTitle.title = subtitle;

      chart.setOption({
        animation: false,
        tooltip: {
          show: false
        },
        series: [
          {
            type: 'graph',
            roam: true,
            data: nodes,
            links,
            layout: 'none',
            focusNodeAdjacency: false,
            legendHoverLink: false,
            lineStyle: {
              color: 'rgba(62, 110, 180, 0.72)',
              width: 1.3,
              curveness: 0.12,
              opacity: NORMAL_OPACITY
            },
            label: {
              show: true
            },
            edgeLabel: {
              show: true
            },
            emphasis: {
              scale: false,
              itemStyle: {
                opacity: 1,
                shadowBlur: 10,
                shadowColor: '#5f84c2'
              }
            },
            edgeSymbol: ['none', 'none'],
            symbol: 'circle',
            symbolSize: 34,
            edgeSymbolSize: [0, 0],
            itemStyle: {
              borderWidth: 1,
              borderColor: 'rgba(255,255,255,0.65)'
            }
          }
        ],
        graphic: rings
      }, true);

      detailPanel.classList.remove('show');
      applyNodeFocus(null);
      chart.resize();
    }

    function onFamilyClick(key, familyName, orderName) {
      if (!chart) return;
      document.querySelectorAll('.family-item').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.key === key);
      });
      renderFamily(key, familyName, orderName);
    }

    chartDom.addEventListener('click', () => {
      // 点击空白区域隐藏弹窗，不清空聚焦（以便反复查看）
      // 空白点击会触发此监听后续会有 echarts 事件覆盖，保留此注释占位
    });

    detailClose.addEventListener('click', () => {
      detailPanel.classList.remove('show');
    });

    if (chart) {
      chart.on('click', (params) => {
        if (params && params.dataType === 'edge') {
          applyNodeFocus(null);
          showEdgePanel({
            cn: params.data.cn,
            en: params.data.en,
            count: params.data.count,
            birds: params.data.birds
          });
          return;
        }

        if (params && params.dataType === 'node') {
          applyNodeFocus(params.data.id);
          return;
        }

        applyNodeFocus(null);
      });

      chart.on('dblclick', () => {
        applyNodeFocus(null);
        detailPanel.classList.remove('show');
      });

      chart.on('globalout', () => {
        if (!detailPanel.classList.contains('show')) {
          applyNodeFocus(null);
        }
      });

      window.addEventListener('resize', () => {
        if (!chart || !currentFamilyKey) return;
        const activeBtn = document.querySelector(`.family-item[data-key="${currentFamilyKey}"]`);
        if (activeBtn) {
          const orderContainer = activeBtn.closest('details');
          const orderName = orderContainer?.querySelector('summary span')?.textContent || '目';
          const familyName = activeBtn.querySelector('.family-name')?.textContent || '科';
          renderFamily(currentFamilyKey, familyName, orderName);
        }
      });
    }

    buildTree();
  </script>
</body>
</html>
